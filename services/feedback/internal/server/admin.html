<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FastAiApi · 反馈管理</title><style>
:root{font:15px/1.6 system-ui,sans-serif;color:#193331;background:#f1f6f5}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:40px 24px}header,.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:30px;letter-spacing:-1px;margin:6px 0}h2{font-size:20px}small,.muted{color:#687d7b}.brand{letter-spacing:3px;color:#18877b}section,article{background:white;border:1px solid #dce7e5;border-radius:20px;padding:24px;margin-top:24px;min-width:0}#login{max-width:440px;margin:60px auto}label{display:grid;gap:7px;margin:16px 0}input,textarea,button,select{font:inherit}input,textarea,select{width:100%;min-width:0;padding:12px;border:1px solid #cddbd8;border-radius:10px;background:white;color:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 20px;background:#146e62;color:white}button.secondary{background:#edf3f1;color:#274e48}button:disabled{opacity:.5;cursor:wait}button:focus-visible,a:focus-visible{outline:3px solid #2dbca8;outline-offset:3px}[hidden]{display:none!important}.controls{display:flex;gap:12px;flex-wrap:wrap}.controls input{flex:1;min-width:160px}.record{display:block;text-align:left;width:100%;background:white;color:inherit;border:1px solid #e0e8e6;margin-top:12px;padding:18px}.record:hover{border-color:#1caa96;background:#f2faf8}.record strong{display:block;overflow-wrap:anywhere}.record small{display:block;margin-top:5px}.pill{font-size:12px;border-radius:20px;background:#e1f5ee;color:#16745b;padding:3px 10px}#notice{white-space:pre-wrap;overflow-wrap:anywhere;color:#256758}dialog{border:1px solid #dce7e5;border-radius:22px;padding:24px;width:min(700px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;color:inherit}dialog::backdrop{background:#0c2228a6;backdrop-filter:blur(4px)}dialog header{position:sticky;top:-24px;background:white;padding:12px 0;z-index:1}#detail-body{white-space:pre-wrap;overflow-wrap:anywhere}#detail-images{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}#detail-images img{max-width:100%;height:auto;border-radius:10px}#detail-images a{overflow-wrap:anywhere}.empty{text-align:center;padding:40px;color:#6c807c}@media(max-width:600px){main{padding:20px 12px}section,article{padding:18px}h1{font-size:25px}#detail-images{grid-template-columns:1fr}dialog{padding:18px}dialog header{top:-18px}}
</style><script src="/fastaiapi/feedback-admin/admin.js" defer></script></head><body><main>
<header><div><small class="brand">FASTAIAPI · SUPPORT</small><h1>反馈管理</h1><p class="muted">集中查看用户反馈，管理 Lark 通知。</p></div><button id="logout" class="secondary" hidden>退出登录</button></header>
<p id="notice" role="status"></p>
<section id="login"><h2>管理员登录</h2><p class="muted">此入口仅供管理员使用。</p><form id="login-form"><label>账号<input name="username" value="admin" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录后台</button></form></section>
<div id="workspace" hidden><section><div class="toolbar"><h2>用户反馈</h2><button id="refresh" class="secondary">刷新列表</button></div><div class="controls"><input id="search" placeholder="搜索标题、内容或联系方式" aria-label="搜索反馈"><select id="filter" aria-label="通知状态"><option value="all">全部通知状态</option><option value="pending">待通知</option><option value="sent">已通知</option></select></div><p id="count" class="muted"></p><div id="records"></div></section>
<section><details><summary>Lark 通知设置</summary><p id="config-status" class="muted"></p><form id="config-form"><label>机器人 Webhook<input name="webhook" type="password" autocomplete="off" placeholder="https://open.larksuite.com/open-apis/bot/v2/hook/…" required></label><label>签名密钥（机器人开启签名校验时填写）<input name="secret" type="password" autocomplete="off"></label><div class="controls"><button>保存通知配置</button><button id="test" type="button" class="secondary">发送测试通知</button></div><p class="muted">凭据仅保存在此服务端，不会返回或分发给客户端。修改配置需填写完整信息。</p></form></details></section></div>
<dialog id="detail" aria-labelledby="detail-title"><header><h2 id="detail-title">反馈详情</h2><button id="close" class="secondary" aria-label="关闭详情">关闭</button></header><p id="detail-meta" class="muted"></p><div id="detail-body"></div><h3>截图</h3><div id="detail-images"></div></dialog>
</main></body></html>
